<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS-015 — Cámara + Manos · BARRETT SESSIONS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; font-family:'Space Grotesk','Segoe UI',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }

  /* Marco vertical 9:16 que cabe en cualquier pantalla */
  #stage {
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    background:#000;
    overflow:hidden;
    box-shadow:0 0 80px rgba(255,42,42,0.15), 0 0 0 1px #111;
  }
  canvas#screen { position:absolute; inset:0; width:100%; height:100%; display:block; }
  video#cam { position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; }

  /* ── HUD (DOM: NO vibra con la onda grave) ── */
  #hud {
    position:absolute; top:0; left:0; right:0;
    padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none; z-index:5;
    background:linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:#8a8a8a;
  }
  #energyWrap { display:flex; align-items:center; gap:8px; }
  #energyLabel { color:#bbb; }
  #energyBar {
    width:90px; height:5px; background:rgba(255,255,255,0.12); border-radius:99px; overflow:hidden;
  }
  #energyFill {
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, #FF2A2A, #FF2A2A);
    transition:width 0.08s linear;
    box-shadow:0 0 12px rgba(255,42,42,0.8);
  }
  #boltState { color:#8a8a8a; }

  /* ── Botones del HUD ── */
  #hudBtns {
    position:absolute; right:16px; top:44px; z-index:6;
    display:flex; flex-direction:column; gap:6px;
  }
  #hudBtns button {
    background:rgba(0,0,0,0.55); border:1px solid #222; border-radius:99px;
    color:#8a8a8a; font-size:9px; letter-spacing:0.14em; text-transform:uppercase;
    padding:5px 12px; cursor:pointer; font-family:inherit;
  }
  #hudBtns button:hover { border-color:#FF2A2A; color:#fff; }
  #hudBtns button.activo { border-color:#FF2A2A; color:#FF2A2A; }

  /* ── Instrucciones ── */
  #hints {
    position:absolute; bottom:0; left:0; right:0; z-index:5;
    padding:14px 16px 16px;
    font-size:11px; letter-spacing:0.08em; color:#5c5c5c;
    text-align:center;
    background:linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
    pointer-events:none;
  }
  #hints b { color:#9a9a9a; font-weight:600; }
  #hints .sep { margin:0 6px; color:#555; }

  /* ── Badge "sin cámara" (solo visible en modo demo) ── */
  #demoBadge {
    position:absolute; top:46px; left:50%; transform:translateX(-50%);
    z-index:5; pointer-events:none; display:none;
    font-size:9px; letter-spacing:0.16em; text-transform:uppercase;
    color:#555; background:rgba(0,0,0,0.55);
    border:1px solid #222; border-radius:99px;
    padding:4px 12px; white-space:nowrap;
  }
  #demoBadge b { color:#FF2A2A; font-weight:700; }

  /* ── Hint de detección (live): solo aparece si se ve menos de una mano ── */
  #handHint {
    position:absolute; top:78px; left:50%; transform:translateX(-50%);
    z-index:5; pointer-events:none; display:none;
    font-size:9px; letter-spacing:0.16em; text-transform:uppercase;
    color:#bbb; background:rgba(0,0,0,0.55);
    border:1px solid #FF2A2A; border-radius:99px;
    padding:4px 12px; white-space:nowrap;
  }

  /* ── Overlay inicial ── */
  #overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; background:#000;
    transition:opacity 0.6s ease;
  }
  #overlay.oculto { opacity:0; pointer-events:none; }
  #overlay img { width:52%; max-width:420px; filter:drop-shadow(0 0 24px rgba(255,255,255,0.25)); }
  #overlayTit {
    font-size:13px; letter-spacing:0.5em; text-transform:uppercase; color:#666;
    text-indent:0.5em;
  }
  #btnEntrar {
    background:transparent; border:1px solid #FF2A2A; border-radius:99px;
    color:#fff; font-family:inherit; font-size:13px; font-weight:600;
    letter-spacing:0.34em; text-transform:uppercase; text-indent:0.34em;
    padding:16px 46px; cursor:pointer;
    box-shadow:0 0 24px rgba(255,42,42,0.35), inset 0 0 18px rgba(255,42,42,0.12);
    transition:box-shadow 0.2s, background 0.2s;
  }
  #btnEntrar:hover { background:rgba(255,42,42,0.14); box-shadow:0 0 44px rgba(255,42,42,0.6); }
  #overlayMsg { font-size:10px; letter-spacing:0.12em; color:#444; min-height:14px; }

  /* ── Modo limpio (H): oculta HUD para evento ── */
  #stage.limpio #hud, #stage.limpio #hudBtns, #stage.limpio #hints, #stage.limpio #demoBadge { display:none; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="screen" aria-hidden="true"></canvas>
  <video id="cam" autoplay playsinline muted></video>

  <div id="hud">
    <div id="energyWrap">
      <span id="energyLabel">Energía</span>
      <div id="energyBar"><div id="energyFill"></div></div>
    </div>
    <div id="boltState">⚡ RAYOS: en espera</div>
  </div>

  <div id="hudBtns">
    <button id="btnMute"   title="M">🔇 Silencio (M)</button>
    <button id="btnLimpio" title="H">◻ Modo limpio (H)</button>
    <button id="btnDemo"   title="D">✋ Modo demo (D)</button>
  </div>

  <div id="demoBadge"><b>SIN CÁMARA</b> · modo simulador — el mouse mueve las manos</div>
  <div id="handHint">✋ muestra las dos manos en cámara</div>

  <div id="hints">
    <b>Manos</b> = energía <span class="sep">·</span>
    <b>Pellizco</b> = pinch ⚡ <span class="sep">·</span>
    <b>Sonrisa</b> = convoca <span class="sep">·</span>
    <b>Separar manos</b> = abre el filtro <span class="sep">·</span>
    <b>1/2</b> = paleta <span class="sep">·</span>
    <b>M</b> = silencio <span class="sep">·</span>
    <b>H</b> = limpio <span class="sep">·</span>
    <b>D</b> = demo
  </div>

  <div id="overlay">
    <img id="overlayLogo" src="assets/logo-barrett.png" alt="BARRETT">
    <div id="overlayTit">BARRETT SESSIONS</div>
    <button id="btnEntrar">ENTRAR</button>
    <div id="overlayMsg" aria-live="polite"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
